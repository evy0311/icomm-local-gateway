name: icomm-mqtt
services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      MQTT_URL: ${MQTT_URL:-mqtt://host.docker.internal:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      DEVICE_NAME: ${DEVICE_NAME:-A. O. Smith water heater}
      DEVICE_PROFILE: ${DEVICE_PROFILE:-reselec3}
      DEVICE_ID: ${DEVICE_ID:-}
      READ_ONLY: ${READ_ONLY:-true}
      GATEWAY_MODE: ${GATEWAY_MODE:-local}
      CLOUD_HOST: ${CLOUD_HOST:-}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1}
      CAPTURE_MODE: ${CAPTURE_MODE:-redacted}
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-homeassistant}
      DATA_FILE: /data/state.json
    volumes:
      - gateway-data:/data
    ports:
      - "${STATUS_BIND_IP:-127.0.0.1}:${STATUS_PORT:-8789}:8081"
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:8082"
      - "${BIND_IP:-127.0.0.1}:${ANS_PORT:-55055}:55055/udp"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  tls:
    image: httpd:2.4.57-bullseye@sha256:4bdb49b01ab1a7b019410337588f772eebe6ae01d038987aa849fcb798fbf26f
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./certs:/certs:ro
volumes:
  gateway-data:
