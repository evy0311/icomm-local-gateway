<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iCOMM Local Gateway</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#0d1720; color:#edf6fb }
    body { max-width:900px; margin:0 auto; padding:48px 24px }
    h1 { margin-bottom:4px } .sub { color:#9fb4c2; margin-top:0 }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-top:30px }
    .card { background:#182a36; border:1px solid #2b4758; border-radius:16px; padding:22px }
    .label { color:#9fb4c2; font-size:.9rem } .value { font-size:2rem; font-weight:700; margin-top:6px }
    .ok { color:#76dda2 } .unknown { color:#e5b567; font-size:1rem }
    .controls { margin-top:24px; background:#182a36; border:1px solid #2b4758; border-radius:16px; padding:22px }
    form { display:flex; gap:10px; align-items:end; flex-wrap:wrap }
    label { color:#9fb4c2; display:grid; gap:6px }
    input, button { font:inherit; border-radius:9px; padding:10px 12px; border:1px solid #456276 }
    input { width:110px; background:#0d1720; color:#edf6fb }
    button { background:#42a9d5; color:#07131a; font-weight:700; cursor:pointer }
    button.secondary { background:transparent; color:#edf6fb }
    button:disabled { opacity:.45; cursor:not-allowed }
    #command-status { color:#b8cbd6; min-height:1.4em; margin-bottom:0 }
    pre { white-space:pre-wrap; color:#b8cbd6; font-size:.85rem }
  </style>
</head>
<body>
  <h1>iCOMM Local Gateway</h1>
  <p class="sub">Live state decoded locally from the heater’s telemetry.</p>
  <p id="status">Waiting for telemetry…</p>
  <section class="grid">
    <div class="card"><div class="label">Setpoint</div><div class="value" id="setpoint">—</div></div>
    <div class="card"><div class="label">Mode</div><div class="value" id="mode">—</div></div>
    <div class="card"><div class="label">Vacation</div><div class="value" id="vacation">—</div></div>
    <div class="card"><div class="label">Hot-water level</div><div class="value unknown">Not decoded</div></div>
    <div class="card"><div class="label">Energy usage</div><div class="value unknown">Not decoded</div></div>
  </section>
  <section class="controls">
    <h2>Local controls</h2>
    <form id="setpoint-form">
      <label>Setpoint (°F)<input id="setpoint-input" type="number" min="95" max="130" step="1" required></label>
      <button id="setpoint-button" type="submit">Set temperature</button>
    </form>
    <form id="vacation-form" style="margin-top:16px">
      <label>Vacation days<input id="vacation-days" type="number" min="1" max="99" step="1" value="7" required></label>
      <button class="local-command-button" type="submit">Start vacation</button>
      <button class="local-command-button" id="standard-button" type="button">Return to Standard</button>
    </form>
    <p id="command-status"></p>
    <button class="secondary" id="cancel-button" type="button" hidden>Cancel pending command</button>
  </section>
  <details style="margin-top:28px"><summary>Decoder details</summary><pre id="details"></pre></details>
  <script>
    let lastState;
    async function refresh() {
      try {
        const state = await fetch('/api/state', { cache:'no-store' }).then(r => r.json());
        lastState = state;
        const latest = state.latest;
        document.querySelector('.sub').textContent = `Gateway mode: ${state.gatewayMode}. Live state decoded locally from heater telemetry.`;
        const disabled = Boolean(state.pendingCommand);
        document.querySelector('#setpoint-button').disabled = disabled;
        document.querySelectorAll('.local-command-button').forEach(button => { button.disabled = disabled; });
        document.querySelector('#cancel-button').hidden = !state.pendingCommand;
        const commandStatus = document.querySelector('#command-status');
        if (state.pendingCommand?.status === 'queued') commandStatus.textContent = 'Command queued locally; the isolated heater may take about 5–6 minutes to poll for it…';
        else if (state.pendingCommand) commandStatus.textContent = `Command ${state.pendingCommand.status}; waiting for heater confirmation…`;
        else if (state.lastCommand?.confirmedAt) commandStatus.textContent = `Last command confirmed ${new Date(state.lastCommand.confirmedAt).toLocaleString()}.`;
        else commandStatus.textContent = 'Ready for a local command.';
        if (!latest) {
          document.querySelector('#status').textContent = state.lastDecodeError
            ? `Telemetry received, but this layout is not supported yet: ${state.lastDecodeError.message}`
            : 'Waiting for telemetry…';
          return;
        }
        const decoded = latest.decoded;
        document.querySelector('#status').innerHTML = `<span class="ok">Receiving telemetry</span> · ${new Date(latest.receivedAt).toLocaleString()}`;
        document.querySelector('#setpoint').textContent = `${decoded.setpoint.fahrenheit}°F`;
        document.querySelector('#mode').textContent = decoded.mode.name;
        document.querySelector('#vacation').textContent = decoded.mode.name === 'VACATION' ? `${decoded.mode.vacationDays} days` : 'Off';
        const input = document.querySelector('#setpoint-input');
        if (document.activeElement !== input) input.value = decoded.setpoint.fahrenheit;
        document.querySelector('#details').textContent = JSON.stringify({ temperatureCandidates: decoded.temperatureCandidates, confidence: decoded.decodedConfidence }, null, 2);
      } catch (error) { document.querySelector('#status').textContent = error.message; }
    }
    document.querySelector('#setpoint-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.querySelector('#command-status');
      try {
        const response = await fetch('/api/desired-setpoint', {
          method:'POST',
          headers:{ 'content-type':'application/json' },
          body:JSON.stringify({ fahrenheit:Number(document.querySelector('#setpoint-input').value) }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        status.textContent = result.message;
        await refresh();
      } catch (error) { status.textContent = error.message; }
    });
    async function setMode(payload) {
      const status = document.querySelector('#command-status');
      try {
        const response = await fetch('/api/desired-mode', {
          method:'POST',
          headers:{ 'content-type':'application/json' },
          body:JSON.stringify(payload),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        status.textContent = result.message;
        await refresh();
      } catch (error) { status.textContent = error.message; }
    }
    document.querySelector('#vacation-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await setMode({ mode:'VACATION', days:Number(document.querySelector('#vacation-days').value) });
    });
    document.querySelector('#standard-button').addEventListener('click', async () => {
      await setMode({ mode:'STANDARD' });
    });
    document.querySelector('#cancel-button').addEventListener('click', async () => {
      const response = await fetch('/api/cancel-command', { method:'POST' });
      const result = await response.json();
      document.querySelector('#command-status').textContent = response.ok ? 'Pending command cancelled.' : result.error;
      await refresh();
    });
    refresh(); setInterval(refresh, 3000);
  </script>
</body>
</html>
