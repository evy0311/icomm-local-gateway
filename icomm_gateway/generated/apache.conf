# Preserve the previously tested legacy TLS frontend. Never expose to the Internet.
ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 443
PidFile "/tmp/icomm-mqtt-httpd.pid"
Mutex posixsem
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
User daemon
Group daemon
SSLSessionCache "shmcb:/tmp/icomm-mqtt-ssl-cache(512000)"
ErrorLog /proc/self/fd/2
LogLevel warn ssl:info
<VirtualHost *:443>
    SSLEngine On
    SSLCertificateFile /certs/device.crt
    SSLCertificateKeyFile /certs/device.key
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://gateway:8080/ connectiontimeout=5 timeout=45
    ProxyPassReverse / http://gateway:8080/
    CustomLog /proc/self/fd/1 "Heater HTTP method=%m status=%>s bytes=%B"
</VirtualHost>
# Deliberately omit request paths, headers and bodies from the access log.
